```html
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Pokédex - PokéAPI</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT"
          crossorigin="anonymous">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="container my-4">

        <h1 class="text-center mb-4">Pokédex</h1>

        <!-- Mensaje de carga -->
        <div id="spinner" class="text-center my-4 d-none">

            <div class="spinner-border" role="status">
                <span class="visually-hidden">Cargando...</span>
            </div>

            <p class="mt-2">Cargando Pokémon...</p>

        </div>

        <!-- Listado de Pokémon -->
        <div id="lista-pokemon" class="row g-4">
        </div>

        <!-- Botón para cargar más Pokémon -->
        <div class="text-center my-4">

            <button id="btn-mas-pokemon" class="btn btn-primary">
                Cargar más Pokémon
            </button>

        </div>

    </div>


    <!-- Modal para mostrar información -->
    <div class="modal fade" id="modalPokemon" tabindex="-1">

        <div class="modal-dialog">

            <div class="modal-content">

                <div class="modal-header">

                    <h5 id="modal-titulo" class="modal-title">
                        Información del Pokémon
                    </h5>

                    <button type="button"
                            class="btn-close"
                            data-bs-dismiss="modal">
                    </button>

                </div>

                <div id="modal-contenido" class="modal-body">
                </div>

            </div>

        </div>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
            crossorigin="anonymous">
    </script>

    <script src="js/app.js"></script>

</body>

</html>
```
