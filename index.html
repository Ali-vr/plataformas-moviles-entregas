<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Ali.vr — Plataformas Móviles</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet"/>
<style>
/* ─── RESET & FONT ─── */
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Press Start 2P',monospace;background:#000;overflow-x:hidden;}

/* ─── MAP FRAME (NES-style beige border) ─── */
.nes-frame{
  max-width:900px;margin:0 auto;padding:12px;
  background:#000;
}
.nes-inner{
  border:4px solid #e8b86d;
  background:#e8b86d;
  padding:4px;
  box-shadow:0 0 0 4px #000, 0 0 0 8px #e8b86d;
  image-rendering:pixelated;
}

/* ─── WORLD MAP CANVAS ─── */
.world-map{
  position:relative;
  width:100%;
  background:#e8c97a; /* sand/beige base */
  overflow:hidden;
  min-height:520px;
}

/* ─── ZONE PANELS ─── */
/* Each zone is a colored section of the map */
.zone{
  position:absolute;
  border:3px solid rgba(0,0,0,0.35);
}
/* Zone labels */
.zone-label{
  position:absolute;
  font-size:6px;
  color:rgba(0,0,0,0.55);
  letter-spacing:1px;
  pointer-events:none;
  z-index:1;
}

/* ─── PATH LINES (pixel roads) ─── */
.path-h,.path-v{position:absolute;background:#c8a448;z-index:2;}
.path-h{height:14px;}
.path-v{width:14px;}
/* white dashes on paths */
.path-h::after,.path-v::after{
  content:'';position:absolute;background:#fff;opacity:.4;
}
.path-h::after{height:3px;top:50%;transform:translateY(-50%);left:0;right:0;
  background:repeating-linear-gradient(90deg,#fff 0 10px,transparent 10px 18px);}
.path-v::after{width:3px;left:50%;transform:translateX(-50%);top:0;bottom:0;
  background:repeating-linear-gradient(180deg,#fff 0 10px,transparent 10px 18px);}

/* ─── STAGE NODES ─── */
.stage{
  position:absolute;
  z-index:10;
  cursor:pointer;
  text-decoration:none;
  display:flex;flex-direction:column;align-items:center;
  width:80px;
  transform:translate(-50%,-50%);
}
.stage-circle{
  width:52px;height:52px;
  border-radius:50%;
  border:3px solid #000;
  background:#fff;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
  box-shadow:2px 2px 0 #000;
  transition:transform .12s,box-shadow .12s;
  position:relative;
}
.stage:hover .stage-circle{
  transform:translateY(-4px) scale(1.1);
  box-shadow:2px 6px 0 #000;
}
.stage-num{
  font-size:6px;color:#fff;
  background:#c00;border:2px solid #000;
  padding:1px 4px;border-radius:1px;
  margin-top:3px;box-shadow:1px 1px 0 #000;
  white-space:nowrap;
}
.stage-name{
  font-size:5px;
  background:rgba(255,255,255,.9);
  border:1px solid #aaa;
  padding:1px 3px;
  border-radius:1px;
  margin-top:2px;
  text-align:center;
  max-width:80px;
  line-height:1.4;
}
.stage-tag{
  font-size:6px;padding:0 3px;border:1px solid;border-radius:1px;margin-top:2px;
}
.tag-html{color:#a06000;border-color:#a06000;background:#fff8e0;}
.tag-css{color:#004880;border-color:#004880;background:#e0f0ff;}
.tag-js{color:#205000;border-color:#205000;background:#e8ffe0;}
.tag-boot{color:#500080;border-color:#500080;background:#f0e0ff;}
.tag-php{color:#803000;border-color:#803000;background:#fff0e0;}

/* ─── SPRITE SVGS ─── */
.stage-circle svg{image-rendering:pixelated;width:42px;height:42px;}

/* ─── DECORATIVE TILES ─── */
.deco{position:absolute;z-index:3;pointer-events:none;font-size:0;}
.deco svg{image-rendering:pixelated;}

/* ─── HUD BAR ─── */
.hud-bar{
  background:#000;color:#fff;
  display:flex;align-items:center;gap:1rem;
  padding:6px 10px;font-size:7px;letter-spacing:1px;
  border-top:3px solid #e8b86d;
}
.hud-bar span{color:#3af;}

/* ─── LOADING OVERLAY ─── */
#loading-overlay{
  display:none;position:fixed;inset:0;
  background:#000;z-index:9999;
  flex-direction:column;align-items:center;justify-content:center;gap:1.5rem;
}
#loading-overlay.show{display:flex;}
.lo-title{font-size:10px;color:#f7d44c;letter-spacing:3px;}
.lo-game{font-size:18px;color:#3af7ff;letter-spacing:2px;animation:blink 1s step-end infinite;}
.lo-sprite{width:64px;height:64px;animation:bob .5s steps(2) infinite;}
.lo-sprite svg{image-rendering:pixelated;width:64px;height:64px;}
.lo-bar-wrap{width:260px;height:16px;border:3px solid #333;background:#111;}
.lo-bar{height:100%;width:0;background:#39ff14;transition:width .07s linear;}
.lo-pct{font-size:8px;color:#39ff14;letter-spacing:2px;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:0;}}
@keyframes bob{0%{transform:translateY(0);}50%{transform:translateY(-8px);}}

/* ─── ZONE-SPECIFIC BACKGROUNDS ─── */
/* SMB Mushroom Kingdom — warm beige */
.zone-mario{background:linear-gradient(180deg,#87ceeb 0%,#87ceeb 40%,#5aad3a 40%,#3a7a22 100%);opacity:1;}
/* Sonic Green Hill — bright green */
.zone-sonic{background:#4fa83d;}
/* Mortal Kombat — dark red/stone */
.zone-mk{background:#4a2810;}
/* Dishonored / Half-Life — grey industrial */
.zone-industrial{background:#556b6e;}
/* Bioshock underwater */
.zone-water{background:#1a4a6e;}
/* Last of Us / CJ — overgrown urban */
.zone-urban{background:#3a5028;}
/* Devil May Cry — gothic dark red */
.zone-dmc{background:#2a0a0a;}
/* CS / Military — desert tan */
.zone-cs{background:#a08050;}
</style>
</head>

   PIXEL ART SVG SPRITES — each 14x14 pixel grid

════════════════════════════════════════════════ */
function px(pixels,id=''){
  // pixels = array of {x,y,w,h,c} rects in 14x14 grid -> viewBox 0 0 14 14
  const rects=pixels.map(p=>`<rect x="${p.x}" y="${p.y}" width="${p.w||1}" height="${p.h||1}" fill="${p.c}"/>`).join('');
  const anim=id?`class="${id}-anim"`:'';
  return `<svg viewBox="0 0 14 14" xmlns="http://www.w3.org/2000/svg" ${anim}>${rects}</svg>`;
}

/* ═══════════════════════════════════════════
   DRAW PATH BETWEEN NODES
═══════════════════════════════════════════ */
function drawPath(){
  const svgEl=document.getElementById('path-svg');
  const mapRect=mapEl.getBoundingClientRect();
  const circles=[...mapEl.querySelectorAll('.stage-circle')];
  const pts=circles.map(c=>{
    const r=c.getBoundingClientRect();
    return{x:r.left-mapRect.left+r.width/2,y:r.top-mapRect.top+r.height/2};
  });
  if(pts.length<2) return;
  svgEl.setAttribute('viewBox',`0 0 ${mapEl.offsetWidth} ${mapEl.offsetHeight}`);

  // Remove old path
  while(svgEl.firstChild) svgEl.removeChild(svgEl.firstChild);

  // Draw path segments between consecutive nodes
  for(let i=0;i<pts.length-1;i++){
    const A=pts[i],B=pts[i+1];
    // Road border
    const rb=document.createElementNS('http://www.w3.org/2000/svg','line');
    rb.setAttribute('x1',A.x);rb.setAttribute('y1',A.y);
    rb.setAttribute('x2',B.x);rb.setAttribute('y2',B.y);
    rb.setAttribute('stroke','#7a5020');rb.setAttribute('stroke-width','10');
    rb.setAttribute('stroke-linecap','round');
    svgEl.appendChild(rb);
    // Road fill
    const rf=document.createElementNS('http://www.w3.org/2000/svg','line');
    rf.setAttribute('x1',A.x);rf.setAttribute('y1',A.y);
    rf.setAttribute('x2',B.x);rf.setAttribute('y2',B.y);
    rf.setAttribute('stroke','#e8c870');rf.setAttribute('stroke-width','6');
    rf.setAttribute('stroke-linecap','round');
    svgEl.appendChild(rf);
    // Dash
    const rd=document.createElementNS('http://www.w3.org/2000/svg','line');
    rd.setAttribute('x1',A.x);rd.setAttribute('y1',A.y);
    rd.setAttribute('x2',B.x);rd.setAttribute('y2',B.y);
    rd.setAttribute('stroke','#fff');rd.setAttribute('stroke-width','2');
    rd.setAttribute('stroke-dasharray','8 8');rd.setAttribute('opacity','.5');
    svgEl.appendChild(rd);
  }
}
window.addEventListener('load',()=>setTimeout(drawPath,150));
window.addEventListener('resize',drawPath);

/* ═══════════════════════════════════════════
   LOADING SCREEN
═══════════════════════════════════════════ */
const overlay=document.getElementById('loading-overlay');
const loBar=document.getElementById('lo-bar');
const loGame=document.getElementById('lo-game');
const loPct=document.getElementById('lo-pct');
const loSprite=document.getElementById('lo-sprite');

// Hide on back navigation
window.addEventListener('pageshow',()=>overlay.classList.remove('show'));

function showLoading(href,gameName,spriteSvg){
  loGame.textContent=gameName;
  loSprite.innerHTML=spriteSvg||'';
  loBar.style.width='0%';loPct.textContent='0%';
  overlay.classList.add('show');
  const steps=[{to:18,ms:80},{to:40,ms:100},{to:62,ms:70},{to:78,ms:90},{to:90,ms:80},{to:97,ms:120},{to:100,ms:80}];
  let si=0;
  function run(){
    if(si>=steps.length){setTimeout(()=>{window.location.href=href;},200);return;}
    const s=steps[si++];
    setTimeout(()=>{loBar.style.width=s.to+'%';loPct.textContent=s.to+'%';run();},s.ms);
  }
  run();
}

document.addEventListener('click',e=>{
  const node=e.target.closest('.stage');
  if(!node) return;
  e.preventDefault();
  const idx=parseInt(node.dataset.idx);
  const lvl=levels[idx];
  showLoading(node.dataset.href,node.dataset.game,lvl.svg);
});
