<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Ali.vr — Plataformas Móviles</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323:wght@400&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#0a0a12;--panel:#111122;--border:#2a2a5a;
  --gold:#f7d44c;--green:#39ff14;--red:#ff3a3a;
  --blue:#3af7ff;--purple:#b06aff;--dim:#555577;--text:#e8e8f0;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  background-color:var(--bg);
  background-image:linear-gradient(rgba(58,247,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(58,247,255,.03) 1px,transparent 1px);
  background-size:32px 32px;
  font-family:'Press Start 2P',monospace;color:var(--text);
  min-height:100vh;padding:2rem 1rem 4rem;
}
header{text-align:center;padding:2.5rem 1rem 1rem;}
.scanline-badge{display:inline-block;font-family:'VT323',monospace;font-size:1rem;letter-spacing:4px;color:var(--blue);text-transform:uppercase;margin-bottom:.75rem;animation:blink 1.4s step-end infinite;}
h1{font-size:clamp(.85rem,2.5vw,1.25rem);color:var(--gold);text-shadow:0 0 12px var(--gold),0 0 30px rgba(247,212,76,.35);line-height:1.6;margin-bottom:.5rem;}
.subtitle{font-family:'VT323',monospace;font-size:1.3rem;color:var(--dim);letter-spacing:2px;}
.coin-strip{margin:1.5rem auto 0;display:flex;justify-content:center;gap:.4rem;font-size:.55rem;color:var(--gold);}
.coin{animation:coinpop .6s ease-in-out infinite alternate;}
.coin:nth-child(2){animation-delay:.15s;}.coin:nth-child(3){animation-delay:.3s;}
.select-banner{text-align:center;margin:2.5rem auto 2rem;position:relative;}
.select-banner::before,.select-banner::after{content:'▶▶▶';color:var(--purple);font-size:.55rem;position:absolute;top:50%;transform:translateY(-50%);}
.select-banner::before{left:0;}.select-banner::after{right:0;content:'◀◀◀';}
.select-banner span{font-size:clamp(.6rem,1.8vw,.8rem);color:var(--green);text-shadow:0 0 8px var(--green);letter-spacing:3px;}
.level-list{max-width:800px;margin:0 auto;display:flex;flex-direction:column;gap:0;}
.level-item{display:grid;grid-template-columns:64px 1fr auto;align-items:center;gap:1rem;padding:1rem 1.2rem;background:var(--panel);border:2px solid var(--border);border-bottom:none;position:relative;transition:background .15s,border-color .15s;text-decoration:none;color:inherit;cursor:pointer;}
.level-item:first-child{border-radius:6px 6px 0 0;}
.level-item:last-child{border-bottom:2px solid var(--border);border-radius:0 0 6px 6px;}
.level-item:hover{background:#181832;border-color:var(--purple);z-index:1;}
.level-item:hover .level-name{color:var(--gold);text-shadow:0 0 8px var(--gold);}
.level-item:hover .arrow{opacity:1;transform:translateX(4px);}
.sprite-wrap{width:56px;height:56px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.sprite-wrap svg{image-rendering:pixelated;overflow:visible;}
.level-info{overflow:hidden;}
.level-num{font-size:.42rem;color:var(--dim);letter-spacing:2px;margin-bottom:.35rem;}
.level-name{font-size:clamp(.5rem,1.6vw,.7rem);color:var(--text);line-height:1.5;transition:color .15s;}
.level-tag{display:inline-block;margin-top:.4rem;font-family:'VT323',monospace;font-size:.9rem;padding:1px 6px;border:1px solid;border-radius:2px;letter-spacing:1px;}
.arrow{font-size:.65rem;color:var(--purple);opacity:0;transition:opacity .15s,transform .15s;}
.tag-html{color:var(--gold);border-color:var(--gold);}
.tag-css{color:var(--blue);border-color:var(--blue);}
.tag-js{color:var(--green);border-color:var(--green);}
.tag-boot{color:var(--purple);border-color:var(--purple);}
.tag-php{color:#ff8c42;border-color:#ff8c42;}

/* LOADING OVERLAY */
#loading-overlay{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;opacity:1;transition:opacity .3s;gap:2rem;pointer-events:none;}
#loading-overlay.hidden{opacity:0;}
#loading-overlay.gone{display:none;}
.load-title{font-size:clamp(.55rem,1.8vw,.8rem);color:var(--gold);letter-spacing:3px;text-align:center;}
.load-game{font-family:'VT323',monospace;font-size:1.8rem;color:var(--blue);letter-spacing:2px;text-align:center;animation:blink 1s step-end infinite;}
.load-bar-wrap{width:280px;height:18px;border:2px solid var(--border);position:relative;overflow:hidden;}
.load-bar{height:100%;width:0;background:var(--green);transition:width .08s linear;}
.load-pct{font-size:.55rem;color:var(--green);margin-top:.5rem;letter-spacing:2px;}

footer{text-align:center;margin-top:3rem;font-family:'VT323',monospace;font-size:1rem;color:var(--dim);letter-spacing:2px;}
footer span{color:var(--red);}

@keyframes blink{0%,100%{opacity:1;}50%{opacity:0;}}
@keyframes coinpop{from{transform:translateY(0);}to{transform:translateY(-4px);}}

/* CHARACTER HOVER ANIMATIONS */
@keyframes mario-jump{0%,100%{transform:translateY(0);}45%{transform:translateY(-16px);}55%{transform:translateY(-16px);}}
@keyframes sonic-dash{0%{transform:translateX(0) scaleX(1) rotate(0deg);}30%{transform:translateX(8px) scaleX(0.75) rotate(-10deg);}60%{transform:translateX(-5px) scaleX(1.1) rotate(5deg);}100%{transform:translateX(0) scaleX(1) rotate(0deg);}}
@keyframes scorpion-spear{0%,100%{transform:translateX(0);}35%{transform:translateX(10px);}65%{transform:translateX(-5px);}}
@keyframes link-spin{0%{transform:rotate(0deg);}100%{transform:rotate(360deg);}}
@keyframes ryu-kick{0%,100%{transform:translateY(0) rotate(0deg);}50%{transform:translateY(-10px) rotate(-20deg);}}
@keyframes pac-chomp{0%,100%{transform:scaleX(1) scaleY(1);}50%{transform:scaleX(1.18) scaleY(0.9);}}
@keyframes snake-crawl{0%,100%{transform:translateX(0) translateY(0);}25%{transform:translateX(5px) translateY(-3px);}75%{transform:translateX(-5px) translateY(3px);}}
@keyframes samus-charge{0%,100%{filter:drop-shadow(0 0 2px #39ff14) brightness(1);}50%{filter:drop-shadow(0 0 10px #39ff14) brightness(1.5);}}
@keyframes cloud-float{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}
@keyframes ghost-wave{0%,100%{transform:scaleY(1) translateY(0) scaleX(1);}50%{transform:scaleY(0.9) translateY(3px) scaleX(1.05);}}
@keyframes kirby-bounce{0%,100%{transform:scaleY(1) scaleX(1);}40%{transform:scaleY(0.78) scaleX(1.2);}70%{transform:scaleY(1.15) scaleX(0.92);}}
@keyframes toad-hop{0%,100%{transform:translateY(0) rotate(0deg);}50%{transform:translateY(-12px) rotate(10deg);}}
@keyframes bowser-stomp{0%,100%{transform:translateY(0) scaleY(1);}50%{transform:translateY(5px) scaleY(0.88);}}
@keyframes peach-twirl{0%{transform:rotate(-10deg);}50%{transform:rotate(10deg);}100%{transform:rotate(-10deg);}}
@keyframes yoshi-lick{0%,75%,100%{transform:translateX(0);}50%{transform:translateX(8px);}}
@keyframes dk-pound{0%,100%{transform:translateY(0) scaleY(1);}40%{transform:translateY(-7px) scaleY(1.05);}65%{transform:translateY(3px) scaleY(0.93);}}

.level-item:hover .mario-anim{animation:mario-jump .45s ease-in-out infinite;}
.level-item:hover .sonic-anim{animation:sonic-dash .35s ease-in-out infinite;}
.level-item:hover .scorpion-anim{animation:scorpion-spear .5s ease-in-out infinite;}
.level-item:hover .link-anim{animation:link-spin .55s linear infinite;}
.level-item:hover .ryu-anim{animation:ryu-kick .5s ease-in-out infinite;}
.level-item:hover .pac-anim{animation:pac-chomp .3s ease-in-out infinite;}
.level-item:hover .snake-anim{animation:snake-crawl .6s ease-in-out infinite;}
.level-item:hover .samus-anim{animation:samus-charge .6s ease-in-out infinite;}
.level-item:hover .cloud-anim{animation:cloud-float .75s ease-in-out infinite;}
.level-item:hover .ghost-anim{animation:ghost-wave .7s ease-in-out infinite;}
.level-item:hover .kirby-anim{animation:kirby-bounce .4s ease-in-out infinite;}
.level-item:hover .toad-anim{animation:toad-hop .5s ease-in-out infinite;}
.level-item:hover .bowser-anim{animation:bowser-stomp .5s ease-in-out infinite;}
.level-item:hover .peach-anim{animation:peach-twirl .8s ease-in-out infinite;}
.level-item:hover .yoshi-anim{animation:yoshi-lick .6s ease-in-out infinite;}
.level-item:hover .dk-anim{animation:dk-pound .5s ease-in-out infinite;}
</style>
</head>

const container=document.getElementById('levels');
levels.forEach((lvl,i)=>{
  const a=document.createElement('a');
  a.className='level-item';
  a.href='#';
  a.dataset.href=lvl.href;
  a.dataset.game=lvl.game;
  if(i===0) a.style.borderRadius='6px 6px 0 0';
  if(i===levels.length-1){a.style.borderRadius='0 0 6px 6px';a.style.borderBottom='2px solid var(--border)';}
  a.innerHTML=`
    <div class="sprite-wrap">${sprites[lvl.sprite]||''}</div>
    <div class="level-info">
      <div class="level-num">STAGE ${lvl.n} · ${lvl.game}</div>
      <div class="level-name">${lvl.name.toUpperCase()}</div>
      <span class="level-tag ${lvl.tagClass}">${lvl.tag}</span>
    </div>
    <div class="arrow">▶ START</div>`;
  container.appendChild(a);
  if(i<levels.length-1){
    const hr=document.createElement('div');
    hr.style.cssText='max-width:800px;margin:0 auto;height:2px;background:repeating-linear-gradient(90deg,var(--border) 0 6px,transparent 6px 10px);';
    container.appendChild(hr);
  }
});

/* LOADING SCREEN */
const overlay=document.getElementById('loading-overlay');
const loadBar=document.getElementById('load-bar');
const loadGame=document.getElementById('load-game-name');
const loadPct=document.getElementById('load-pct');

function showLoading(href,gameName){
  loadGame.textContent=gameName;
  loadBar.style.width='0%';
  loadPct.textContent='0%';
  overlay.classList.remove('hidden','gone');
  document.body.style.overflow='hidden';

  const steps=[
    {to:22,ms:80},{to:45,ms:100},{to:58,ms:60},
    {to:74,ms:90},{to:88,ms:70},{to:95,ms:120},{to:100,ms:80}
  ];
  let si=0;
  function run(){
    if(si>=steps.length){
      setTimeout(()=>{ window.location.href=href; },150);
      return;
    }
    const s=steps[si++];
    setTimeout(()=>{
      loadBar.style.width=s.to+'%';
      loadPct.textContent=s.to+'%';
      run();
    },s.ms);
  }
  run();
}

document.querySelectorAll('.level-item').forEach(a=>{
  a.addEventListener('click',e=>{
    e.preventDefault();
    showLoading(a.dataset.href,a.dataset.game);
  });
});
