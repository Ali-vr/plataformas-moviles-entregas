```html
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lista de Compras - DOM y JavaScript</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT"
        crossorigin="anonymous">
</head>

<body>

    <div class="container my-1 my-sm-2 my-md-4 my-lg-5">

        <h1>Lista de Compras</h1>

        <div class="card">
            <div class="card-body">

                <h2>Listado de Productos</h2>

                <ul id="lista-productos">
                    <li>Pan</li>
                </ul>

                <hr class="hr">

                <h2>Agregar Producto</h2>

                <form id="form-producto">

                    <div class="input-group mb-3">

                        <input
                            type="text"
                            class="form-control"
                            aria-label="Nombre del Producto">

                        <button
                            class="btn btn-primary"
                            type="submit">
                            Agregar Producto
                        </button>

                    </div>

                </form>

                <hr class="hr">

                <h2>Opciones</h2>

                <div class="row">

                    <!-- Limpiar lista -->
                    <div class="col-12 col-md-4 my-1">

                        <button
                            id="btn-limpiar"
                            class="btn btn-danger d-block w-100"
                            type="button">
                            Limpiar lista
                        </button>

                    </div>

                    <!-- Ordenar lista -->
                    <div class="col-12 col-md-4 my-1">

                        <button
                            id="btn-ordenar"
                            class="btn btn-secondary d-block w-100"
                            type="button">
                            Ordenar productos
                        </button>

                    </div>

                    <!-- Guardar lista -->
                    <div class="col-12 col-md-4 my-1">

                        <button
                            id="btn-guardar"
                            class="btn btn-success d-block w-100"
                            type="button">
                            Guardar lista
                        </button>

                    </div>

                </div>

            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
        crossorigin="anonymous">
    </script>

    <script type="text/javascript">

        /**
         * agregarProducto()
         *
         * Esta función recibe el nombre de un producto
         * y lo agrega a la lista.
         */
        function agregarProducto(nombreProducto) {

            const listaProductos = document.querySelector("#lista-productos");

            const nuevoProducto = document.createElement("li");

            nuevoProducto.innerText = nombreProducto;

            listaProductos.append(nuevoProducto);

        }


        /**
         * handlerFormulario()
         *
         * Se ejecuta cuando se envía el formulario.
         */
        function handlerFormulario(evento) {

            evento.preventDefault();

            const input = evento.target.querySelector("input");

            const nombreProducto = input.value;

            input.value = "";

            if (nombreProducto != "") {

                agregarProducto(nombreProducto);

            }

        }


        /**
         * Asociamos el evento submit al formulario.
         */
        document
            .querySelector("#form-producto")
            .addEventListener("submit", handlerFormulario);


        /**
         * ELIMINAR PRODUCTOS
         *
         * Agregamos un evento a la lista.
         *
         * Cuando se hace click sobre un producto,
         * se elimina ese elemento.
         */
        document
            .querySelector("#lista-productos")
            .addEventListener("click", function(evento) {

                evento.target.remove();

            });


        /**
         * LIMPIAR LA LISTA
         *
         * remove() elimina elementos del DOM.
         *
         * Mientras la lista tenga un primer elemento,
         * lo eliminamos.
         */
        document
            .querySelector("#btn-limpiar")
            .addEventListener("click", function() {

                const listaProductos = document.querySelector("#lista-productos");

                while (listaProductos.firstElementChild) {

                    listaProductos.firstElementChild.remove();

                }

            });


        /**
         * ORDENAR PRODUCTOS
         *
         * Obtenemos todos los elementos li de la lista.
         *
         * Luego los convertimos en una lista para poder
         * ordenarlos y finalmente volver a agregarlos.
         */
        document
            .querySelector("#btn-ordenar")
            .addEventListener("click", function() {

                const listaProductos = document.querySelector("#lista-productos");

                const productos = Array.from(listaProductos.querySelectorAll("li"));

                productos.sort(function(a, b) {

                    return a.innerText.localeCompare(b.innerText);

                });

                productos.forEach(function(producto) {

                    listaProductos.append(producto);

                });

            });


        /**
         * BONUS TRACK 1
         *
         * EDITAR PRODUCTOS
         *
         * Cuando hacemos doble click sobre un producto,
         * pedimos un nuevo nombre.
         */
        document
            .querySelector("#lista-productos")
            .addEventListener("dblclick", function(evento) {

                const nuevoNombre = prompt(
                    "Escribí el nuevo nombre del producto:"
                );

                if (nuevoNombre != null && nuevoNombre != "") {

                    evento.target.innerText = nuevoNombre;

                }

            });


        /**
         * BONUS TRACK 2
         *
         * MARCAR PRODUCTOS COMO COMPRADOS
         *
         * Cuando hacemos click sobre un producto,
         * cambiamos su estilo para tacharlo.
         */
        document
            .querySelector("#lista-productos")
            .addEventListener("click", function(evento) {

                if (evento.target.style.textDecoration == "line-through") {

                    evento.target.style.textDecoration = "none";

                } else {

                    evento.target.style.textDecoration = "line-through";

                }

            });


        /**
         * BONUS TRACK 3
         *
         * PERSISTENCIA LOCAL
         *
         * Guardamos los productos dentro de localStorage.
         */
        document
            .querySelector("#btn-guardar")
            .addEventListener("click", function() {

                const listaProductos = document.querySelector("#lista-productos");

                const productos = listaProductos.querySelectorAll("li");

                const listaParaGuardar = [];

                productos.forEach(function(producto) {

                    listaParaGuardar.push(producto.innerText);

                });

                localStorage.setItem(
                    "listaDeCompras",
                    JSON.stringify(listaParaGuardar)
                );

            });


        /**
         * CARGAR PRODUCTOS GUARDADOS
         *
         * Cuando se abre la página buscamos la lista
         * guardada en localStorage.
         */
        const productosGuardados = localStorage.getItem("listaDeCompras");

        if (productosGuardados != null) {

            const listaGuardada = JSON.parse(productosGuardados);

            const listaProductos = document.querySelector("#lista-productos");

            listaProductos.innerHTML = "";

            listaGuardada.forEach(function(producto) {

                agregarProducto(producto);

            });

        }

    </script>

</body>
</html>
```
