```html
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lista de Contactos - DOM y JavaScript</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT"
        crossorigin="anonymous">
</head>

<body>

    <div class="container my-1 my-sm-2 my-md-4 my-lg-5">

        <h1>Lista de Contactos</h1>

        <div class="card">
            <div class="card-body">

                <h2>Contactos</h2>

                <ul id="lista-contactos"></ul>

                <hr class="hr">

                <h2>Nuevo Contacto</h2>

                <form id="form-producto">

                    <div class="input-group mb-3">

                        <input
                            type="text"
                            class="form-control"
                            name="nombre"
                            id="input-nombre"
                            placeholder="Nombre"
                            aria-label="Nombre">

                        <input
                            type="text"
                            class="form-control"
                            name="apellido"
                            id="input-apellido"
                            placeholder="Apellido"
                            aria-label="Apellido">

                        <input
                            type="text"
                            class="form-control"
                            name="telefono"
                            id="input-telefono"
                            placeholder="Teléfono"
                            aria-label="Teléfono">

                    </div>

                    <button
                        class="btn btn-primary"
                        type="submit">
                        Agregar Contacto
                    </button>

                </form>

                <hr class="hr">

                <h2>Ordenar contactos</h2>

                <div class="row">

                    <div class="col-12 col-md-4 my-1">
                        <button
                            id="btn-ordenar-nombre"
                            class="btn btn-secondary d-block w-100"
                            type="button">
                            Ordenar por nombre
                        </button>
                    </div>

                    <div class="col-12 col-md-4 my-1">
                        <button
                            id="btn-ordenar-apellido"
                            class="btn btn-secondary d-block w-100"
                            type="button">
                            Ordenar por apellido
                        </button>
                    </div>

                    <div class="col-12 col-md-4 my-1">
                        <button
                            id="btn-favoritos"
                            class="btn btn-warning d-block w-100"
                            type="button">
                            Ver favoritos
                        </button>
                    </div>

                </div>

                <hr class="hr">

                <h2>Buscar contacto</h2>

                <input
                    type="text"
                    id="input-buscar"
                    class="form-control"
                    placeholder="Buscar por nombre, apellido o teléfono">

                <hr class="hr">

                <h2>Acciones</h2>

                <div class="row">

                    <div class="col-12 col-md-4 my-1">
                        <button
                            id="btn-eliminar-seleccionados"
                            class="btn btn-danger d-block w-100"
                            type="button">
                            Eliminar seleccionados
                        </button>
                    </div>

                </div>

            </div>
        </div>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
        crossorigin="anonymous">
    </script>


    <script type="text/javascript">

        let contactos = [
            {
                nombre: 'Juan',
                apellido: 'Perez',
                telefono: '1123456789',
                favorito: false
            },
        ];


        /**
         * agregarContacto()
         *
         * Agrega un nuevo objeto contacto
         * a la lista contactos.
         */
        function agregarContacto(nombre, apellido, telefono) {

            contactos.push({
                nombre: nombre,
                apellido: apellido,
                telefono: telefono,
                favorito: false
            });

            mostrarListado();

        }


        /**
         * mostrarListado()
         *
         * Esta función muestra los contactos
         * guardados en la variable contactos.
         */
        function mostrarListado(listaParaMostrar = contactos) {

            const listaContactos = document.querySelector("#lista-contactos");

            listaContactos.innerHTML = "";


            listaParaMostrar.forEach(function(contacto, posicion) {

                const nuevoContacto = document.createElement("li");

                nuevoContacto.innerText =
                    contacto.nombre + " " +
                    contacto.apellido + " - " +
                    contacto.telefono;


                /**
                 * Botón para marcar como favorito.
                 */
                const botonFavorito = document.createElement("button");

                botonFavorito.innerText =
                    contacto.favorito ? "★ Favorito" : "☆ Favorito";

                botonFavorito.classList.add("btn");
                botonFavorito.classList.add("btn-sm");
                botonFavorito.classList.add("btn-warning");
                botonFavorito.style.marginLeft = "10px";

                botonFavorito.addEventListener("click", function() {

                    contacto.favorito = !contacto.favorito;

                    mostrarListado(listaParaMostrar);

                });


                /**
                 * Botón para editar.
                 *
                 * BONUS TRACK 1
                 */
                const botonEditar = document.createElement("button");

                botonEditar.innerText = "Editar";

                botonEditar.classList.add("btn");
                botonEditar.classList.add("btn-sm");
                botonEditar.classList.add("btn-secondary");

                botonEditar.style.marginLeft = "10px";

                botonEditar.addEventListener("click", function() {

                    const nuevoNombre = prompt(
                        "Nuevo nombre:",
                        contacto.nombre
                    );

                    const nuevoApellido = prompt(
                        "Nuevo apellido:",
                        contacto.apellido
                    );

                    const nuevoTelefono = prompt(
                        "Nuevo teléfono:",
                        contacto.telefono
                    );

                    if (nuevoNombre != null && nuevoNombre != "") {
                        contacto.nombre = nuevoNombre;
                    }

                    if (nuevoApellido != null && nuevoApellido != "") {
                        contacto.apellido = nuevoApellido;
                    }

                    if (nuevoTelefono != null && nuevoTelefono != "") {
                        contacto.telefono = nuevoTelefono;
                    }

                    mostrarListado(listaParaMostrar);

                });


                /**
                 * Botón para eliminar.
                 *
                 * BONUS TRACK 2
                 */
                const botonEliminar = document.createElement("button");

                botonEliminar.innerText = "Eliminar";

                botonEliminar.classList.add("btn");
                botonEliminar.classList.add("btn-sm");
                botonEliminar.classList.add("btn-danger");

                botonEliminar.style.marginLeft = "10px";

                botonEliminar.addEventListener("click", function() {

                    const posicionContacto = contactos.indexOf(contacto);

                    contactos.splice(posicionContacto, 1);

                    mostrarListado();

                });


                /**
                 * Checkbox para seleccionar contactos.
                 *
                 * BONUS TRACK 3
                 */
                const checkbox = document.createElement("input");

                checkbox.type = "checkbox";

                checkbox.classList.add("checkbox-contacto");

                checkbox.dataset.posicion = contactos.indexOf(contacto);

                checkbox.style.marginLeft = "10px";


                nuevoContacto.append(botonFavorito);
                nuevoContacto.append(botonEditar);
                nuevoContacto.append(botonEliminar);
                nuevoContacto.append(checkbox);

                listaContactos.append(nuevoContacto);

            });

        }


        /**
         * handlerFormulario()
         *
         * Obtiene los datos del formulario
         * y llama a agregarContacto().
         */
        function handlerFormulario(e) {

            e.preventDefault();

            const inputNombre =
                e.target.querySelector("#input-nombre");

            const inputApellido =
                e.target.querySelector("#input-apellido");

            const inputTelefono =
                e.target.querySelector("#input-telefono");


            const nombre = inputNombre.value;
            const apellido = inputApellido.value;
            const telefono = inputTelefono.value;


            inputNombre.value = "";
            inputApellido.value = "";
            inputTelefono.value = "";


            if (
                nombre != "" &&
                apellido != "" &&
                telefono != ""
            ) {

                agregarContacto(
                    nombre,
                    apellido,
                    telefono
                );

            }

        }


        /**
         * Asociamos el evento submit al formulario.
         */
        document
            .querySelector("form")
            .addEventListener("submit", handlerFormulario);


        /**
         * ORDENAR POR NOMBRE
         */
        document
            .querySelector("#btn-ordenar-nombre")
            .addEventListener("click", function() {

                contactos.sort(function(a, b) {

                    return a.nombre.localeCompare(b.nombre);

                });

                mostrarListado();

            });


        /**
         * ORDENAR POR APELLIDO
         */
        document
            .querySelector("#btn-ordenar-apellido")
            .addEventListener("click", function() {

                contactos.sort(function(a, b) {

                    return a.apellido.localeCompare(b.apellido);

                });

                mostrarListado();

            });


        /**
         * MOSTRAR FAVORITOS
         */
        document
            .querySelector("#btn-favoritos")
            .addEventListener("click", function() {

                const favoritos = contactos.filter(function(contacto) {

                    return contacto.favorito == true;

                });

                mostrarListado(favoritos);

            });


        /**
         * BONUS TRACK 4
         *
         * BUSCADOR
         *
         * Filtra por nombre, apellido o teléfono.
         */
        document
            .querySelector("#input-buscar")
            .addEventListener("input", function() {

                const textoBuscado =
                    this.value.toLowerCase();

                const contactosEncontrados =
                    contactos.filter(function(contacto) {

                        return (
                            contacto.nombre.toLowerCase().includes(textoBuscado) ||
                            contacto.apellido.toLowerCase().includes(textoBuscado) ||
                            contacto.telefono.includes(textoBuscado)
                        );

                    });

                mostrarListado(contactosEncontrados);

            });


        /**
         * BONUS TRACK 3
         *
         * ELIMINAR VARIOS CONTACTOS
         *
         * Buscamos todos los checkbox seleccionados
         * y eliminamos esos contactos.
         */
        document
            .querySelector("#btn-eliminar-seleccionados")
            .addEventListener("click", function() {

                const checkboxSeleccionados =
                    document.querySelectorAll(
                        ".checkbox-contacto:checked"
                    );


                const posicionesAEliminar = [];


                checkboxSeleccionados.forEach(function(checkbox) {

                    posicionesAEliminar.push(
                        Number(checkbox.dataset.posicion)
                    );

                });


                posicionesAEliminar.sort(function(a, b) {

                    return b - a;

                });


                posicionesAEliminar.forEach(function(posicion) {

                    contactos.splice(posicion, 1);

                });


                mostrarListado();

            });


        /**
         * Mostramos los contactos iniciales
         * cuando se carga la página.
         */
        mostrarListado();

    </script>

</body>
</html>
